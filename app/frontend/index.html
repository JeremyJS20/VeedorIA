<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var theme = localStorage.getItem("heroui-theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
        } else if (theme === "light") {
          document.documentElement.classList.add("light");
          document.documentElement.setAttribute("data-theme", "light");
        } else {
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.add(prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
        }
      })();
    </script>
    <title>VeedorIA — Monitoreo de Contrataciones Públicas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
